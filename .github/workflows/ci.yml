name: backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3-alpine3.23
        env:
          POSTGRES_PASSWORD: synthetic-ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:synthetic-ci-only-password@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal db api tests)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/...
      - run: go mod verify
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: python3 scripts/generate-openapi.py && git diff --exit-code -- api/openapi/openapi.json
      - run: go run github.com/getkin/kin-openapi/cmd/validate@v0.133.0 api/openapi/openapi.json
      - run: docker build -t spartial-backend:ci .
