name: spartial-development
x-environment: &environment
  APP_ENV: development
  HTTP_ADDR: 0.0.0.0:8080
  DATABASE_URL: postgres://spartial_app:${APP_DB_PASSWORD:?run scripts/dev-db.sh or create .env}@postgres:5432/spartial_hms?sslmode=disable
  DATABASE_WORKER_URL: postgres://spartial_worker:${WORKER_DB_PASSWORD:?run scripts/dev-db.sh or create .env}@postgres:5432/spartial_hms?sslmode=disable
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
  CLINIC_TIMEZONE: Africa/Dar_es_Salaam
  CARE_POLICY_ENABLED: ${CARE_POLICY_ENABLED:-true}
  CARE_POLICY_APPROVAL_REF: ${CARE_POLICY_APPROVAL_REF:-}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  CLINIC_NETWORKS: ${CLINIC_NETWORKS:-}
  MFA_ENFORCE_REMOTE_CLINICAL: ${MFA_ENFORCE_REMOTE_CLINICAL:-false}
  IDENTIFIER_INDEX_KEY: ${IDENTIFIER_INDEX_KEY:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  PRIVACY_READ_THRESHOLD: ${PRIVACY_READ_THRESHOLD:-0}
  PRIVACY_MFA_THRESHOLD: ${PRIVACY_MFA_THRESHOLD:-0}
  # Optional in development: without keys, MFA enrollment answers 503 mfa_unavailable.
  PHI_ENCRYPTION_KEYS: ${PHI_ENCRYPTION_KEYS:-}
  PHI_ACTIVE_KEY_ID: ${PHI_ACTIVE_KEY_ID:-}
  MFA_ENFORCE_PRIVILEGED: ${MFA_ENFORCE_PRIVILEGED:-false}
services:
  postgres:
    image: docker.io/library/postgres:18.7-alpine3.23@sha256:60aac580d8dbe3093c097bb1d11f9e62999814d3a1da2c1aaf729c0b7db117f2
    environment:
      POSTGRES_DB: spartial_hms
      POSTGRES_USER: spartial_owner
      POSTGRES_PASSWORD: ${PG_OWNER_PASSWORD:?set a generated owner password}
    ports: ["127.0.0.1:55433:5432"]
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spartial_owner -d spartial_hms"]
      interval: 5s
      timeout: 3s
      retries: 20
  bootstrap:
    build: .
    image: spartial-backend:development
    entrypoint: ["/app/manage"]
    command: ["bootstrap-development"]
    environment:
      <<: *environment
      DATABASE_ADMIN_URL: postgres://spartial_owner:${PG_OWNER_PASSWORD}@postgres:5432/spartial_hms?sslmode=disable
      APP_DB_ROLE: spartial_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set a generated seed password}
      SEED_RECEPTION_PASSWORD: ${SEED_RECEPTION_PASSWORD:?set a generated seed password}
      SEED_TEST_PASSWORD: ${SEED_TEST_PASSWORD:?set a generated seed password}
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: .
    image: spartial-backend:development
    environment: *environment
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
  worker:
    image: spartial-backend:development
    entrypoint: ["/app/worker"]
    environment: *environment
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-spartial-development}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set a generated storage password}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["objects:/data"]
    profiles: [documents]
volumes:
  postgres:
  objects:
